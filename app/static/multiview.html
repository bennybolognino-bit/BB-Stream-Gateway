<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multiview | BB Stream Gateway</title>
    <link rel="stylesheet" href="/static/gateway.css">
    <link rel="stylesheet" href="/static/multiview.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <strong>BB STREAM GATEWAY</strong>
            <span>IP VIDEO SYSTEM</span>
        </div>

        <nav class="navigation">
            <a href="/encoder">ENCODER</a>
            <a href="/decoder">DECODER</a>
            <a href="/catalogo">CATALOGO TV</a>
            <a class="active" href="/multiview">MULTIVIEW</a>
        </nav>
    </aside>

    <section class="content">
        <header>
            <div>
                <h1>Multiview</h1>
                <p>Monitoraggio simultaneo dei decoder</p>
            </div>
            <span class="online">● LIVE MONITOR</span>
        </header>

        <main>
            <div class="toolbar">
                <span>Preview video senza audio</span>

                <div class="multiview-controls">
                    <label for="layout">LAYOUT</label>
                    <select id="layout" onchange="changeLayout()">
                        <option value="2">2 × 2</option>
                        <option value="3">3 × 3</option>
                        <option value="4">4 × 4</option>
                    </select>

                    <button onclick="loadMultiview()">
                        REFRESH
                    </button>
                </div>
            </div>

            <section id="multiview-grid"
                     class="multiview-grid layout-2"></section>
        </main>
    </section>
</div>

<script src="/static/multiview.js"></script>
</body>
</html>
