<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC Multiview | BB Stream Gateway</title>
    <link rel="stylesheet" href="/static/gateway.css">
    <link rel="stylesheet" href="/static/multiview.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <strong>BB STREAM GATEWAY</strong>
            <span>IP VIDEO SYSTEM</span>
        </div>

        <nav class="navigation">
            <a href="/encoder">ENCODER</a>
            <a href="/decoder">DECODER</a>
            <a href="/catalogo">CATALOGO TV</a>
            <a class="active" href="/multiview">MULTIVIEW</a>
        </nav>
    </aside>

    <section class="content">
        <header>
            <div>
                <h1>WebRTC Multiview</h1>
                <p>Low-latency broadcast monitoring</p>
            </div>
            <span id="multiview-status" class="status stopped">
                STOPPED
            </span>
        </header>

        <main>
            <div class="toolbar">
                <div class="multiview-controls">
                    <label for="layout-selector">LAYOUT</label>

                    <select id="layout-selector" onchange="layoutChanged()">
    <option value="grid2">Griglia 2 x 2</option>
    <option value="grid3">Griglia 3 x 3</option>
    <option value="grid4">Griglia 4 x 4</option>
    <option value="main3">1 grande + 3 piccoli</option>
    <option value="main5">1 grande + 5 piccoli</option>
    <option value="custom">Griglia personalizzata</option>
</select>

<select id="custom-columns" style="display:none">
    <option value="1">1 colonna</option>
    <option value="2" selected>2 colonne</option>
    <option value="3">3 colonne</option>
    <option value="4">4 colonne</option>
</select>

                    <button class="start" onclick="startMultiview()">
                        START
                    </button>

                    <button class="stop" onclick="stopMultiview()">
                        STOP
                    </button>

                    <button onclick="openFullscreen()">
                        FULLSCREEN
                    </button>
                </div>
            </div>

            <div id="webrtc-stage" class="webrtc-stage">
                <iframe
                    id="webrtc-viewer"
                    src="about:blank"
                    allow="autoplay; fullscreen"
                    scrolling="no">
                </iframe>

                <div id="channel-labels"
                     class="channel-labels layout-2"></div>

                <div id="waiting-message" class="waiting-message">
                    START MULTIVIEW
                </div>
            </div>

            <div class="channel-order-panel">
    <h3>ORDINE CANALI</h3>
    <p>Trascina i canali per modificarne la posizione.</p>
    <div id="channel-order" class="channel-order"></div>
</div>

<div id="multiview-message"></div>
        </main>
    </section>
</div>

<script src="/static/multiview.js?v=layouts2"></script>
</body>
</html>
